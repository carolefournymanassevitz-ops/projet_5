services:
  db:
    image: mysql:8.0
    container_name: livrai-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: livrai
    ports:
      - "3306:3306"
    volumes:
      - livrai-data:/var/lib/mysql
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  livrai-data:
